[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stomics-py"
version = "0.1.1"
description = "Python client SDK for the Stomics.io spatial transcriptomics data portal"
readme = "README.md"
# X | None annotations are evaluated at import time, so 3.10 is the floor.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stomics.io", email = "support@stomics.io" }]
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "tqdm>=4.64.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anndata = [
    "anndata>=0.9.0",
    "scipy>=1.9.0",
    "numpy>=1.23.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23.0",
]

[project.scripts]
stomics = "stomics.cli:main"

[project.urls]
Homepage = "https://stomics.io"
Repository = "https://github.com/ITGA3/stomics-py"
Issues = "https://github.com/ITGA3/stomics-py/issues"
Documentation = "https://stomics.io/docs/sdk"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=stomics --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["stomics"]
